[platformio]
default_envs = program1

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:program1]
build_src_filter = +<program1/**>

[env:program2]
framework = stm32cube
build_src_filter = +<program2/**>

[env:program4]
build_src_filter = +<program4/**>
lib_deps = stm32duino/STM32duino FreeRTOS

[env:program5]
build_src_filter = +<program5/**>
#upload_protocol = dfu
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -D HAL_PCD_MODULE_ENABLED

[env:program6]
build_src_filter = +<program6/**>
