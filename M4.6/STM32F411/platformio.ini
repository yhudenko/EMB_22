[platformio]
default_envs = program1

; ---------------------------------------------------------------------------
; DMA демо. Кожна програма = окремий env зі своєю папкою в src/.
;   program1 - DMA пам'ять -> пам'ять          (нічого не підключати)
;   program2 - DMA + UART                      (перемичка PA2 -> PA3)
;   program3 - DMA + I2C, датчик BME280        (PB6 SCL, PB7 SDA)
;   program4 - DMA + SPI, датчик BME280        (PA4 CS, PA5 SCK, PA6 MISO, PA7 MOSI)
; Збірка/прошивка: pio run -e program2 -t upload
; ---------------------------------------------------------------------------

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
; upload_protocol = dfu   ; якщо прошиваєте через USB-C (BOOT0 + RESET)
debug_tool = stlink
monitor_speed = 115200
; Serial = USB CDC (USB-C на Black Pill). Так усі UART залишаються вільними для демо.
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED

[env:program1]
build_src_filter = +<program1/**>

[env:program2]
build_src_filter = +<program2/**>
; HAL_UART_MODULE_ONLY: ядро Arduino не чіпає UART (не створює Serial1/2 і не
; займає їхні переривання) - USART2 повністю наш.
build_flags =
    ${env.build_flags}
    -DHAL_UART_MODULE_ONLY

[env:program3]
build_src_filter = +<program3/**>

[env:program4]
build_src_filter = +<program4/**>
