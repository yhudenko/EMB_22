[platformio]
default_envs = program1

; ---------------------------------------------------------------------------
; DMA демо. Кожна програма = окремий env зі своєю папкою в src/.
;   program1 - DMA пам'ять -> пам'ять (GDMA, esp_async_memcpy)   нічого не підключати
;   program2 - DMA + UART (GDMA + UHCI)                          перемичка GPIO17 -> GPIO18
;   program3 - I2C + BME280 (у ESP32-S3 I2C БЕЗ DMA - див. коментар)  GPIO8 SDA, GPIO9 SCL
;   program4 - DMA + SPI, датчик BME280                          GPIO10 CS, 11 MOSI, 12 SCK, 13 MISO
; Лог - Serial0 (UART0 через USB-UART міст), 115200.
; Збірка/прошивка: pio run -e program2 -t upload
; ---------------------------------------------------------------------------

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:program1]
build_src_filter = +<program1/**>

[env:program2]
build_src_filter = +<program2/**>

[env:program3]
build_src_filter = +<program3/**>

[env:program4]
build_src_filter = +<program4/**>
