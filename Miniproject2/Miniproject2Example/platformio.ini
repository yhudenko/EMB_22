[platformio]
default_envs = traffic_light

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:traffic_light]
build_src_filter = +<*>
build_flags = -Iinclude

[env:native_test]
platform = native
build_src_filter = +<traffic_fsm.cpp>
build_flags = -Iinclude -std=c++17
test_framework = unity
