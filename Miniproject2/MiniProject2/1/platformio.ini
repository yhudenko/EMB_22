[platformio]
default_envs = program1

[env]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
upload_speed = 460800

[env:program1]
build_src_filter = +<single_display_seconds/**>

[env:program2]
build_src_filter = +<double_display_seconds/**>

[env:traffic-lights]
build_src_filter = +<traffic_lights/**>+<common/**>