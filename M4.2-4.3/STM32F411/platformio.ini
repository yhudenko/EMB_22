[platformio]
default_envs = program1

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:program1]
build_src_filter = +<program1/**>

[env:program2]
build_src_filter = +<program2/**>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
