[platformio]
default_envs = program1

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:program1]
build_src_filter = +<program1/**>

[env:program2]
build_src_filter = +<program2/**>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:program3]
framework = cmsis
build_src_filter = +<program3/**>

[env:program4]
framework = stm32cube
build_src_filter = +<program4/**>

[env:program5]
build_src_filter = +<program5/**>
build_flags = -Wl,-u,_printf_float -DSERIAL_UART_INSTANCE=1
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BME280 Library@^2.2.4

[env:program6]
build_src_filter = +<program6/**>
build_flags = -DSERIAL_UART_INSTANCE=1
