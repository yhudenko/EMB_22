[platformio]
default_envs = program1

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:program1]
build_src_filter = +<program1/**>
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSBD_USE_CDC
    -DHAL_PCD_MODULE_ENABLED
lib_deps =
    greiman/SdFat@^2.2.3
upload_protocol = dfu